services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: workwize_mdm
      MYSQL_USER: workwize
      MYSQL_PASSWORD: workwize_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3307:3306"
    volumes:
      - mdm_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: "WorkWize MDM Sync"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: workwize_mdm
      DB_USERNAME: workwize
      DB_PASSWORD: workwize_secret
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      JAMF_MODE: mock
      JAMF_MOCK_PATH: /var/www/html/mock/jamf/api-mock-response.json
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - mdm_backend_vendor:/var/www/html/vendor

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - mdm_frontend_node_modules:/app/node_modules

volumes:
  mdm_mysql_data:
  mdm_backend_vendor:
  mdm_frontend_node_modules:
